<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Micro-Jaguariúna 3D</title><style>*{box-sizing:border-box}body{margin:0;background:#efe2c8;font-family:system-ui;color:#382713;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh;touch-action:none}header,nav,.help,.modal{position:absolute;z-index:2}header{top:env(safe-area-inset-top,12px);left:50%;transform:translateX(-50%);background:#fffcf0ee;border-radius:24px;padding:12px 18px;white-space:nowrap;font-weight:800;font-size:13px;box-shadow:0 6px 25px #5433}nav{bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:5px;background:#fffcf0ee;padding:7px;border-radius:20px;max-width:98vw}button{border:0;border-radius:14px;background:#ead5b3;padding:11px 9px;font-weight:700;color:#54371c;font-size:12px}.help{top:70px;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;background:#352518cc;color:white;padding:7px 12px;border-radius:15px}.modal{inset:0;background:#23180eb9;display:none;place-items:center;padding:20px}.modal.show{display:grid}.card{background:#fffaf1;border-radius:22px;padding:24px;max-width:390px;width:100%;max-height:80dvh;overflow:auto}.card h2{margin:0 0 8px}.card p{line-height:1.5}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:15px 0}.tags span{background:#f1e5d3;border-radius:12px;padding:6px 9px;font-size:12px}</style></head><body><canvas id="world"></canvas><header>ESCOLA DAS ARTES · JAGUARIÚNA　⭐ <span id="count">0</span>/3</header><div class="help">Arraste para girar · pinça para zoom · toque nas estrelas</div><nav><button data-go="0">⛪ Matriz</button><button data-go="1">🎨 Escola</button><button data-go="2">🚂 Estação</button><button id="minus">−</button><button id="plus">+</button></nav><div class="modal" id="modal"><div class="card"><h2 id="title"></h2><p id="desc"></p><div class="tags" id="tags"></div><button id="close">Continuar explorando</button></div></div><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d');let W,H,dpr=1,angle=.55,tilt=.65,zoom=1,panX=0,panY=0;const places=[{x:0,z:-12,y:15,name:'Praça Matriz · Cena e Corpo',desc:'O coração histórico da cidade inspira o teatro, a dança e a expressão corporal.',courses:['Teatro Musical','Ballet','Dança de Salão','Circo']},{x:14,z:7,y:10,name:'Escola das Artes · Cores e Criação',desc:'Um espaço para desenvolver talentos, criatividade e novas habilidades.',courses:['Pintura','Desenho','Artes Digitais','Cenografia']},{x:-14,z:7,y:10,name:'Maria Fumaça · Música e Tradição',desc:'A memória ferroviária encontra os sons e as tradições musicais.',courses:['Viola Caipira','Violão','Canto Coral','Percussão']}];let stars=[],collected=new Set();function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}addEventListener('resize',resize);
function project(x,y,z){let xx=x*Math.cos(angle)-z*Math.sin(angle),zz=x*Math.sin(angle)+z*Math.cos(angle);let s=Math.min(W/68,H/56)*zoom;return {x:W/2+panX+xx*s,y:H*.55+panY+(zz*Math.sin(tilt)-y*Math.cos(tilt))*s}}
function poly(points,color,stroke){ctx.beginPath();points.forEach((p,i)=>{let q=project(...p);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.closePath();ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function box(x,z,w,d,h,color,roof){let a=[x-w/2,0,z-d/2],b=[x+w/2,0,z-d/2],cc=[x+w/2,0,z+d/2],dd=[x-w/2,0,z+d/2],A=[a[0],h,a[2]],B=[b[0],h,b[2]],C=[cc[0],h,cc[2]],D=[dd[0],h,dd[2]];poly([a,b,B,A],color);poly([b,cc,C,B],shade(color,.78));poly([cc,dd,D,C],shade(color,.86));poly([dd,a,A,D],shade(color,.7));poly([A,B,C,D],roof||shade(color,1.1))}
function shade(hex,m){let n=parseInt(hex.slice(1),16);return '#'+[n>>16,(n>>8)&255,n&255].map(v=>Math.max(0,Math.min(255,Math.round(v*m))).toString(16).padStart(2,'0')).join('')}
function tree(x,z){box(x,z,.55,.55,2,'#785337');let p=project(x,3.7,z);ctx.beginPath();ctx.arc(p.x,p.y,Math.max(5,12*zoom),0,7);ctx.fillStyle='#57884c';ctx.fill()}
function draw(){ctx.clearRect(0,0,W,H);let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#fff6e8');bg.addColorStop(1,'#e9d6b7');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);poly([[-28,-3,-28],[28,-3,-28],[28,-3,28],[-28,-3,28]],'#765437');poly([[-28,0,-28],[28,0,-28],[28,0,28],[-28,0,28]],'#87ac70');poly([[-5,.05,-25],[5,.05,-25],[5,.05,23],[-5,.05,23]],'#c6b39a');poly([[-23,.06,2],[23,.06,2],[23,.06,12],[-23,.06,12]],'#c6b39a');
let items=[{z:-12,fn:()=>{box(0,-12,8,11,7,'#f6f2e9','#66717b');box(0,-6.5,3,3,13,'#f6f2e9','#5c6673');box(0,-6.5,1,1,17,'#e8d7b7','#5c6673')}},{z:7,fn:()=>{box(14,7,13,7,5,'#f5e5ca','#bd6944');for(let i=0;i<5;i++)box(9+i*2.3,10.55,1.8,.18,2.4,['#1967d2','#db3236','#f4b400','#222222','#1967d2'][i])}},{z:7,fn:()=>{box(-14,7,12,6,5,'#e5ad52','#a55d3c');box(-14,11,12,2,3,'#f4e8cf');for(let i=-2;i<=2;i++)box(-14+i*2.1,14,.35,2,.25,'#4a392c')}}];items.sort((a,b)=>{let q=project(0,0,a.z).y,r=project(0,0,b.z).y;return q-r}).forEach(i=>i.fn());[[-20,-12],[-12,-19],[11,-17],[20,-2],[-21,17],[0,20],[21,18]].forEach(t=>tree(...t));stars=[];places.forEach((p,i)=>{let q=project(p.x,p.y+Math.sin(Date.now()/600+i)*.35,p.z);stars.push(q);ctx.font=(Math.max(21,28*zoom))+'px system-ui';ctx.textAlign='center';ctx.shadowColor='#ffa500';ctx.shadowBlur=15;ctx.fillText(collected.has(i)?'🌟':'⭐',q.x,q.y);ctx.shadowBlur=0});}
let pointers=new Map(),lastDist=0,moved=false,start=null;function dist(){let p=[...pointers.values()];return Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});start={x:e.clientX,y:e.clientY};moved=false;if(pointers.size===2)lastDist=dist()});c.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(Math.hypot(e.clientX-start.x,e.clientY-start.y)>5)moved=true;if(pointers.size===2){let d=dist();zoom=Math.max(.55,Math.min(2.8,zoom*d/lastDist));lastDist=d}else{angle+=(e.clientX-old.x)*.009;tilt=Math.max(.3,Math.min(1.2,tilt+(e.clientY-old.y)*.004))}draw()});c.addEventListener('pointerup',e=>{if(!moved&&pointers.size===1){let i=stars.findIndex(p=>Math.hypot(p.x-e.clientX,p.y-e.clientY)<38);if(i>=0)openPlace(i)}pointers.delete(e.pointerId)});c.addEventListener('pointercancel',e=>pointers.delete(e.pointerId));c.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.55,Math.min(2.8,zoom*(e.deltaY>0?.92:1.08)));draw()},{passive:false});
function openPlace(i){let p=places[i];collected.add(i);document.getElementById('count').textContent=collected.size;document.getElementById('title').textContent=p.name;document.getElementById('desc').textContent=p.desc;document.getElementById('tags').innerHTML=p.courses.map(s=>'<span>'+s+'</span>').join('');document.getElementById('modal').classList.add('show');draw()}document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('show');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>openPlace(+b.dataset.go));document.getElementById('plus').onclick=()=>{zoom=Math.min(2.8,zoom*1.2);draw()};document.getElementById('minus').onclick=()=>{zoom=Math.max(.55,zoom/1.2);draw()};resize();setInterval(draw,80);
</script></body></html>
